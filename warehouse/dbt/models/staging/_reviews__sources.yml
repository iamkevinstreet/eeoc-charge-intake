# Author:            Kevin Street
# Created on:        2026-11-09
# Last modified on:  2026-11-09
#
# The raw tables `python -m pipelines load reviews` fills from the
# review exports, each checked against contract v1 first; the rows' own
# contract is pipelines/rows.py. Freshness says when the load last ran.

sources:
  - name: reviews
    description: >
      Every export of a finished review: the record after each field's
      decision, what the model read, and the decisions.
    schema: raw_reviews
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 36, period: hour}
        error_after: {count: 72, period: hour}
    tables:
      - name: exports
        description: One row per export, keyed by its review and its time.
      - name: export_values
        description: >
          One row per value of an export's record or of what the model read:
          per field, and per item of a list field. An empty field has no row.
      - name: export_decisions
        description: One row per field of an export, with its decision.
