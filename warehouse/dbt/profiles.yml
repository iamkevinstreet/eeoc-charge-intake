# Author:            Kevin Street
# Created on:        2026-11-09
# Last modified on:  2026-11-09
#
# Where dbt builds: dev is the DuckDB file the loaders fill, prod the
# Databricks SQL warehouse. Nothing here is a secret or a location:
# `python -m pipelines dbt ...` sets every variable from the settings,
# so the loaders and dbt always use the same warehouse.

warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('WAREHOUSE_PATH') }}"
      threads: 4
      settings:
        TimeZone: UTC
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: analytics
      threads: 4
