[[diagram]]
file = "flow.svg"
width = 1000
height = 560
title = "How a charge is reviewed"
subtitle = "A value is shown only with its quote on its page; nothing exports until every field is decided."
caption = "Steps in reading order. Blue: the request that leaves your machine."

[[diagram.component]]
box = [28, 160, 272, 80]
name = "1. Upload or pick"
details = ["a charge and its notice, as PDFs", "or one of the generated samples"]

[[diagram.component]]
box = [364, 160, 272, 80]
name = "2. Check the files"
details = ["at most 10 MB each, PDFs only", "a limit on extractions a minute"]

[[diagram.component]]
box = [700, 160, 272, 80]
name = "3. Read the pages"
details = ["page text from each PDF", "an unreadable file stops here"]

[[diagram.component]]
box = [28, 300, 272, 80]
name = "4. Extract the fields"
details = ["one model call, eleven fields", "each with a quote and its page"]

[[diagram.component]]
box = [364, 300, 272, 80]
name = "5. Check every quote"
details = ["the quote must be on its page", "if not, emptied with the reason"]

[[diagram.component]]
box = [700, 300, 272, 80]
name = "6. A person decides"
details = ["accept, edit or reject each field", "export once all are decided"]

