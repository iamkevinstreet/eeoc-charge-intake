########################################################################
#                                                                      #
#                        backend/pyproject.toml                        #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-29
# Last modified on:  2026-11-10
#
# Packages the charge intake service and sets ruff, mypy and pytest to
# the code standard.

[project]
name = "eeoc-charge-intake"
version = "0.9.0"
description = "EEOC charge intake: extraction with source spans and human review."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Street", email = "info@kevindstreet.com" }]
dependencies = [
  "kds-args>=0.8.0,<0.9",
  "kds-settings>=0.8.0,<0.9",
  "kds-logs>=0.8.0,<0.9",
  "kds-llm>=0.8.0,<0.9",
  "kds-evals>=0.8.0,<0.9",
  "kds-synthetic>=0.8.0,<0.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.18",
  "pypdf>=6.1",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# The evaluation dashboard and the figures and CSV files the case study and Tableau read.
dashboard = ["dash>=3", "plotly>=6", "pandas>=2.2"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "types-jsonschema>=4.23",
  "jsonschema>=4.23",
  "mypy>=1.13",
  "opentelemetry-sdk>=1.45",
  "pandas-stubs>=2.2",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "ruff==0.17.3",
  "kds-standards>=0.8.0,<0.9",
  "kds-diagrams>=0.8.0,<0.9",
]

# Our own packages come from the utils repository at one reviewed commit; none
# of them is on PyPI, so a same-named public package can never be installed.
[tool.uv.sources]
kds-args = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "args", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }
kds-settings = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "settings", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }
kds-logs = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "logs", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }
kds-llm = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "llm", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }
kds-evals = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "evals", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }
kds-synthetic = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "synthetic", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }
kds-standards = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "standards", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }
kds-diagrams = { git = "https://github.com/iamkevinstreet/utils", subdirectory = "diagrams", rev = "c6acc75155fb1a7350c6e8ccb09a57ce01bba40c" }

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# The src layout: the package lives in src/, so the tests import the installed package.
[tool.setuptools.packages.find]
where = ["src"]
include = ["eeoc_intake*"]

# The reviews database's migrations and the export contract ship inside the package.
[tool.setuptools.package-data]
eeoc_intake = ["db/*.sql", "contracts/*.json"]

[tool.ruff]
line-length = 99
target-version = "py312"
# isort reads the package in src/ and the tests' own modules as first-party code.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "BLE", "S", "C90", "PL", "RUF", "G", "D", "ANN"]
# A module's doc block opens with its fields (Author and the dates), not a summary, so the
# summary-first docstring rules do not fit it; kds-standards checks every function's doc block.
ignore = ["D205", "D212", "D415", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
# Tests assert and repeat expected values inline.
"tests/**" = ["S101", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Dash registers a pytest plugin for browser tests we do not use; its old-style hooks warn.
addopts = "-q -p no:dash"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["eeoc_intake"]

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "dash", "dash.*"]
ignore_missing_imports = true
