name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      LLM_MODEL: fake-model
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets scan (whole history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dashboard]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Tests
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Review screen builds
        run: cd ui && npm ci && npm run build

      - name: Smoke evaluation (offline)
        run: |
          python -m eeoc_intake.generate --n 10 --out eeoc_intake/data/generated
          python -m eeoc_intake.evals.run --cases eeoc_intake/data/generated/cases.jsonl --fake

      - name: Dashboard and export build from the smoke results
        run: |
          python -m eeoc_intake.evals.export
          python -c "from eeoc_intake.dashboard import build_app; build_app(); print('dashboard builds')"

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eeoc_intake/evals/results/smoke/*.md
