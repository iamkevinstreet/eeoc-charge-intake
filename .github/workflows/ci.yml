########################################################################
#                                                                      #
#                       .github/workflows/ci.yml                       #
#                                                                      #
########################################################################
# Author:            Kevin Street
# Created on:        2026-10-14
# Last modified on:  2026-11-09
#
# Runs on every push and pull request: the secrets scan, lint, types,
# the code standard, the tests, the offline evaluation and the audits;
# and for the warehouse, its loads, the dbt build on DuckDB, its docs
# and the DAG tests. The dependency-updates workflow runs the same
# checks on the commit it is about to land.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch: a branch is checked before it has a pull request.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check; blank checks the commit that started the run.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The review store's tests run against a real Postgres; it is the runner's alone.
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: reviews
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: reviews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviews" --health-interval 5s --health-retries 10
    env:
      REVIEWS_TEST_DATABASE_URL: postgresql://reviews:ci-only@localhost:5432/reviews_test
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0  # the secrets scan and the header dates read all of history
          persist-credentials: false

      - name: Secrets scan (whole history)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked backend with the dashboard (hashes checked)
        run: uv sync --project backend --locked --all-extras

      - name: Lint, format, strict types and the code standard
        run: make check-backend

      - name: Tests
        run: make test-backend

      - name: Offline smoke evaluation (no key, no network; fails if any document fails)
        run: make eval

      - name: Known vulnerabilities in Python dependencies
        run: make audit-backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked frontend
        run: npm --prefix frontend ci

      - name: Lint, format and types
        run: make check-frontend

      - name: Tests
        run: make test-frontend

      - name: Production build
        run: make build

      - name: Known vulnerabilities in npm dependencies
        run: make audit-frontend

  warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: warehouse
    env:
      RUNTIME__DLTHUB_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked warehouse (hashes checked)
        run: uv sync --locked

      - name: Lint, format and strict types
        run: make check

      - name: Tests, offline
        run: make test

      - name: Known vulnerabilities in every locked dependency
        run: make audit

      - name: Load the review exports and the EEOC's national statistics
        run: make load

      - name: Build and test every model on DuckDB, the published totals among them
        run: make build

      - name: The docs site, with its lineage graph
        run: make docs

  warehouse-dags:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: warehouse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.6"

      - name: Install the locked warehouse with Airflow
        run: uv sync --locked --group airflow

      - name: DAG import and integrity tests
        run: uv run --no-sync pytest tests/test_dags.py
